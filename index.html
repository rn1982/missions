<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Missions">
<meta name="theme-color" content="#2FB8FF">
<link rel="apple-touch-icon" href="icon.png">
<title>Missions Héros</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Bungee&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: game HUD on top, one scene band, big tappable mission cards, then the two reward meters side by side (stacked on phones). Single deliberate game-world look. */
:root{
  color-scheme: light;
  --ink:#151A3D; --ink-2:#5A6290; --paper:#FFFFFF; --ground:#EEF2FF; --line:#D5DAEB;
  --gold:#FFC21A; --gold-hi:#FFE873; --red:#E3263C; --blue:#1574E0; --green:#17A35A; --purple:#6B3FE0;
  --done:#FFF4C2;
  --f-display:'Baloo 2', 'Arial Rounded MT Bold', system-ui, sans-serif;
  --f-hud:'Bungee', 'Baloo 2', system-ui, sans-serif;
  --f-body:'Nunito', system-ui, sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--ground);color:var(--ink)}
:root{padding-top:env(safe-area-inset-top, 0px);padding-bottom:env(safe-area-inset-bottom, 0px)}
body{font-size:14px;-webkit-text-size-adjust:100%}
textarea.bk{width:100%;min-height:76px;padding:10px 12px;border:3px solid var(--ink);border-radius:14px;font:700 13px/1.3 ui-monospace,Menlo,monospace;color:var(--ink);background:var(--paper);-webkit-user-select:text;user-select:text;resize:vertical}
body{font-family:var(--f-body);font-weight:800;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.glossy{border:3px solid var(--ink);box-shadow:inset 0 3px 0 rgba(255,255,255,.45),0 4px 0 var(--ink)}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink),0 16px 26px rgba(21,26,61,.14)}

/* scene band */
.scene{position:relative;background:linear-gradient(180deg,#2FB8FF,#C4F0FF);border-bottom:3px solid var(--ink);overflow:hidden}
.scene.evening{background:linear-gradient(180deg,#1E1660,#5B3FD6)}
.scene.bonus{background:linear-gradient(180deg,#FF7E6B,#FFD98A)}
.scene .rays{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.scene .hills{position:absolute;left:0;right:0;bottom:-2px;width:100%;height:70px}
.scene-in{position:relative;padding-top:14px}
.scene-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.pill{display:flex;align-items:center;gap:10px;height:54px;padding:0 16px 0 5px;background:var(--paper);border:3px solid var(--ink);border-radius:28px;box-shadow:0 4px 0 var(--ink)}
.pill .ava{width:42px;height:42px;border-radius:50%;background:linear-gradient(180deg,var(--gold-hi),#FFB000);border:3px solid var(--ink);display:grid;place-items:center;flex:none}
.pill .lbl{font-family:var(--f-hud);font-size:12px;line-height:1;color:var(--ink-2)}
.pill .val{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.05}
.pill.plain{padding:0 16px}
.spacer{flex:1}
.iconbtn{width:54px;height:54px;border-radius:50%;background:var(--paper);display:grid;place-items:center}
.title-block{padding-bottom:22px;padding-top:16px;min-width:0}
.badge{display:inline-block;padding:4px 14px 3px;border-radius:999px;font-family:var(--f-hud);font-size:15px;color:#fff;text-shadow:0 2px 0 var(--ink);background:linear-gradient(180deg,#FF7A85,#E3263C)}
.big-title{display:block;margin-top:6px;height:96px;width:min(440px,70vw)}
.hero{flex:none;width:150px;height:170px;margin-bottom:-6px}

/* tabs */
.tabs{display:flex;gap:12px;margin:18px 0 6px;flex-wrap:wrap}
.tab{flex:1 1 160px;min-height:64px;display:flex;align-items:center;justify-content:center;gap:10px;border-radius:18px;background:var(--paper);font-family:var(--f-display);font-weight:800;font-size:24px}
.tab[aria-selected="true"]{color:#fff;text-shadow:0 2px 0 var(--ink)}
.tab[data-tab="matin"][aria-selected="true"]{background:linear-gradient(180deg,#FFC15C,#FF7A1A)}
.tab[data-tab="soir"][aria-selected="true"]{background:linear-gradient(180deg,#8E73FF,#4A2FC0)}
.tab[data-tab="bonus"][aria-selected="true"]{background:linear-gradient(180deg,#63E6A0,#17A35A)}
.tab .count{font-family:var(--f-body);font-size:15px;padding:2px 9px;border-radius:999px;background:rgba(21,26,61,.12)}
.tab[aria-selected="true"] .count{background:rgba(255,255,255,.28);text-shadow:none}

/* missions */
.missions{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:16px;margin:14px 0 26px}
.mission{position:relative;display:flex;align-items:center;gap:14px;min-height:118px;padding:14px 16px;text-align:left;background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);transition:transform .12s ease, box-shadow .12s ease}
.mission:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.mission .tile{flex:none;width:76px;height:76px}
.mission .txt{flex:1;min-width:0}
.mission .fr{display:block;font-family:var(--f-display);font-weight:800;font-size:25px;line-height:1.05}
.mission .sub{display:block;font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1.1;margin-top:2px}
.mission .en{display:block;font-size:14px;color:var(--ink-2);margin-top:3px}
.mission .slot{flex:none;width:58px;height:58px}
.mission.bonus .slot{width:50px;height:50px}
.mission.done{background:var(--done)}
.mission.done .slot{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.mission .kind{position:absolute;top:-12px;right:16px;font-family:var(--f-hud);font-size:11px;padding:3px 9px;border-radius:999px;border:2.5px solid var(--ink);background:var(--gold-hi)}
.mission.bonus .kind{background:#A8ECFF}
@keyframes pop{0%{transform:scale(.4) rotate(-20deg)}100%{transform:scale(1) rotate(0)}}
.empty-note{grid-column:1/-1;padding:20px;text-align:center;font-family:var(--f-display);font-size:22px}

/* meters */
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr));gap:18px;margin-bottom:40px}
.meter{padding:16px 18px 18px}
.meter h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.1;text-wrap:balance}
.meter .h-en{font-size:14px;color:var(--ink-2)}
.bar-row{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.bar{display:flex;gap:6px;padding:7px;background:linear-gradient(180deg,#2B3266,#151A3D);border:3px solid var(--ink);border-radius:20px}
.blk{width:52px;height:52px;border-radius:12px;background:#EEF1FA;border:3px solid #C3CAE0;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:22px;color:#AAB2CF}
.blk.on{background:linear-gradient(180deg,#63E6A0,#17A35A);border-color:#0E6E3B;color:#fff;text-shadow:0 2px 0 var(--ink);animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.medal{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 40% 35%,#FFF6B0,#FFC21A 60%,#FF9A00);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);filter:grayscale(1) opacity(.55)}
.medal.on{filter:none;animation:wiggle 1.6s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.status{margin-top:12px;font-family:var(--f-display);font-weight:700;font-size:18px;line-height:1.2}
.status .en{display:block;font-family:var(--f-body);font-size:14px;color:var(--ink-2)}
.road{display:flex;align-items:center;gap:0;margin-top:14px;flex-wrap:wrap}
.node{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:28px;color:#AAB2CF;background:#EEF1FA;border:3px solid #C3CAE0}
.node.on{color:#fff;text-shadow:0 2px 0 var(--ink);border-color:var(--ink);box-shadow:inset 0 3px 0 rgba(255,255,255,.45),0 4px 0 var(--ink)}
.node.on.n1{background:linear-gradient(180deg,#FF7A85,#E3263C)}
.node.on.n2{background:linear-gradient(180deg,#FFC15C,#FF7A1A)}
.node.on.n3{background:linear-gradient(180deg,#63E6A0,#17A35A)}
.link{width:34px;height:8px;background:repeating-linear-gradient(90deg,#AAB2CF 0 8px,transparent 8px 14px)}
.link.on{background:repeating-linear-gradient(90deg,#FFC21A 0 8px,transparent 8px 14px)}
.goal{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;margin-left:8px;border-radius:999px;background:#EEF1FA;border:3px solid #C3CAE0;font-family:var(--f-display);font-weight:800;font-size:18px;color:#AAB2CF}
.goal.on{background:linear-gradient(180deg,#FFE873,#FFB000);border-color:var(--ink);color:var(--ink);box-shadow:0 4px 0 var(--ink)}

/* overlays */
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(21,26,61,.55)}
.sheet{width:min(560px,100%);max-height:calc(100% - 20px);overflow:auto;padding:22px}
.sheet h3{margin:0 0 4px;font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.1}
.sheet .en{font-size:14px;color:var(--ink-2)}
.celebrate{text-align:center}
.celebrate .burst{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,8vw,72px);line-height:1;color:var(--gold);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink)}
.cta{display:inline-flex;align-items:center;justify-content:center;min-height:60px;padding:0 28px;margin-top:18px;border-radius:999px;font-family:var(--f-display);font-weight:800;font-size:24px;color:#fff;text-shadow:0 2px 0 var(--ink);background:linear-gradient(180deg,#63E6A0,#17A35A)}
.cta.blue{background:linear-gradient(180deg,#5CCBFF,#1574E0)}
.cta.gold{background:linear-gradient(180deg,#FFE873,#FFB000);color:var(--ink);text-shadow:none}
.cta.ghost{background:var(--paper);color:var(--ink);text-shadow:none}
.cta.small{min-height:46px;font-size:18px;padding:0 18px;margin-top:0}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.pad button{min-height:68px;border-radius:18px;background:var(--paper);font-family:var(--f-display);font-weight:800;font-size:30px}
.dots{display:flex;justify-content:center;gap:14px;margin-top:14px}
.dots i{width:20px;height:20px;border-radius:50%;border:3px solid var(--ink);background:var(--paper)}
.dots i.on{background:var(--ink)}
.err{min-height:22px;margin-top:8px;color:var(--red);text-align:center}
.field{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.field input{flex:1;min-width:0;height:54px;padding:0 16px;border:3px solid var(--ink);border-radius:16px;font-family:var(--f-display);font-weight:700;font-size:22px;color:var(--ink);background:var(--paper);-webkit-user-select:text;user-select:text}
.sec{margin-top:20px;padding-top:16px;border-top:2.5px dashed var(--line)}
.sec h4{margin:0 0 8px;font-family:var(--f-display);font-weight:800;font-size:21px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{min-height:64px;border-radius:14px;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:800;font-size:15px;line-height:1.1}
.day .n{font-size:13px;color:var(--ink-2)}
.day.won{background:linear-gradient(180deg,#63E6A0,#17A35A);color:#fff;text-shadow:0 1px 0 var(--ink)}
.day.won .n{color:#fff}
.day[aria-pressed="true"]{outline:4px solid var(--blue);outline-offset:2px}
.toggles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr));gap:8px;margin-top:10px}
.tg{display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 12px;border-radius:14px;background:var(--paper);text-align:left;font-size:16px}
.tg svg{flex:none}
.tg.on{background:var(--done)}
.row-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.note{font-size:14px;color:var(--ink-2);line-height:1.4;font-weight:700}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:70;padding:12px 20px;border-radius:999px;background:var(--ink);color:#fff;font-size:16px}
@media (max-width:620px){
  .hero{width:96px;height:110px}
  .blk{width:42px;height:42px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<header class="scene" id="scene">
  <svg class="rays" viewBox="0 0 800 240" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><path d="M220 150 L811 46 L811 254 Z M220 150 L606 610 L425 714 Z M220 150 L15 714 L-166 610 Z M220 150 L-371 254 L-371 46 Z M220 150 L-166 -310 L15 -414 Z M220 150 L425 -414 L606 -310 Z" fill="#FFFFFF" opacity=".16"/></svg>
  <svg class="hills" viewBox="0 0 800 70" preserveAspectRatio="none" aria-hidden="true"><path id="hillPath" d="M0 50 C120 10 240 18 340 40 C440 0 600 0 800 30 V72 H0 Z" fill="url(#hillA)" stroke="#151A3D" stroke-width="3"/></svg>
  <div class="wrap scene-in">
    <div class="hud">
      <button class="pill" id="nameBtn" aria-label="Changer le nom du joueur">
        <span class="ava"><svg width="26" height="24"><use href="#headIcon"/></svg></span>

/* ---------- dates ---------- */
const pad2 = n => String(n).padStart(2,'0');
const keyOf = d => d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const noon = d => { const x = new Date(d); x.setHours(12,0,0,0); return x; };
const addDays = (d,n) => { const x = noon(d); x.setDate(x.getDate()+n); return x; };
const monday = d => { const x = noon(d); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; };
const weekDates = m => Array.from({length:7}, (_,i) => keyOf(addDays(m,i)));
const DAY_SHORT = ['DIM','LUN','MAR','MER','JEU','VEN','SAM'];
const DAY_LONG = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const isWeekend = d => d.getDay() === 0 || d.getDay() === 6;

/* ---------- state ---------- */
const S = {
  mode:'local', db:null,
  cfg:{name:'', pinHash:''},
  days:{}, weeks:{}, sw:{claimedWeek:''},
  tab:null, sound:true, parentDay:null
};
try { S.sound = localStorage.getItem('hmc-sound') !== 'off'; } catch(e) {}

const today = () => noon(new Date());
const todayKey = () => keyOf(today());
const doneOf = k => (S.days[k] && S.days[k].done) || {};
const dayWon = k => { const d = doneOf(k); return KEY_IDS.every(id => d[id]); };
const keyCount = k => { const d = doneOf(k); return KEY_IDS.filter(id => d[id]).length; };
const weekWon = m => weekDates(m).filter(dayWon).length;
const weekId = m => keyOf(m);

function streakInfo(){
  // consecutive weeks with 5+ won days, newest first; the current week counts once it reaches 5
  const cur = monday(today());
  const claimed = S.sw.claimedWeek || '';
  let count = 0, latest = '';
  if (weekWon(cur) >= 5 && weekId(cur) > claimed) { count = 1; latest = weekId(cur); }
  for (let i = 1; i <= 4; i++){
    const m = addDays(cur, -7*i);
    if (weekId(m) <= claimed) break;
    if (weekWon(m) >= 5) { count++; if (!latest) latest = weekId(m); } else break;
  }
  return {count, latest};
}

/* ---------- storage ---------- */
function saveLocal(){
  if (S.mode !== 'local') return;
  try { localStorage.setItem('hmc-data', JSON.stringify({cfg:S.cfg, days:S.days, weeks:S.weeks, sw:S.sw})); } catch(e) {}
}
function loadLocal(){
  try { const raw = localStorage.getItem('hmc-data'); if (raw) { const d = JSON.parse(raw); Object.assign(S, {cfg:d.cfg||S.cfg, days:d.days||{}, weeks:d.weeks||{}, sw:d.sw||S.sw}); } } catch(e) {}
}
async function write(path, data){
  if (S.mode === 'db') {
    try { await S.db.doc(path).set(data); }
    catch(e){
      if (e && e.code === 'unavailable') { setTimeout(() => S.db.doc(path).set(data).catch(()=>toast("Pas de connexion : réessaie plus tard.")), 800 + Math.random()*800); }
      else toast("Impossible d'enregistrer. Vérifie la connexion.");
    }
  } else saveLocal();
}
const saveDay = k => write('days/'+k, {date:k, done:doneOf(k)});

async function initStore(){
  let db = null;
  try { if (window.claude && typeof window.claude.use === 'function') db = await window.claude.use('db'); } catch(e) { db = null; }
  if (!db) { loadLocal(); render(); return; }
  S.db = db; S.mode = 'db';
  const from = keyOf(addDays(monday(today()), -35));
  db.collection('days').where('date','>=',from).onSnapshot(snap => {
    const next = {}; snap.docs.forEach(d => { next[d.id] = d.data(); }); S.days = next; render();
  }, () => {});
  db.collection('weeks').onSnapshot(snap => { const next = {}; snap.docs.forEach(d => { next[d.id] = d.data(); }); S.weeks = next; render(); }, () => {});
  db.doc('config/main').onSnapshot(s => { S.cfg = Object.assign({name:'', pinHash:''}, s.exists ? s.data() : {}); render(); maybeAskName(); }, () => {});
  db.doc('rewards/switch').onSnapshot(s => { S.sw = Object.assign({claimedWeek:''}, s.exists ? s.data() : {}); render(); }, () => {});
}

/* ---------- sound ---------- */
let actx = null;
function tones(seq){
  if (!S.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime;
    seq.forEach(([f, dur, at, type]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'square'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0+at);
      g.gain.exponentialRampToValueAtTime(0.12, t0+at+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+at+dur);
      o.connect(g); g.connect(actx.destination); o.start(t0+at); o.stop(t0+at+dur+0.03);
    });
  } catch(e) {}
}
const SFX = {
  coin: () => tones([[988,.09,0],[1319,.28,.09]]),

  undo: () => tones([[440,.12,0,'triangle'],[330,.18,.1,'triangle']]),
  win: () => tones([[523,.12,0],[659,.12,.12],[784,.12,.24],[1047,.5,.36],[784,.12,.62],[1047,.6,.74]]),

};

/* ---------- confetti ---------- */
function confetti(){
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.getElementById('confetti'); c.hidden = false;
  const ctx = c.getContext('2d'); const dpr = window.devicePixelRatio || 1;
  c.width = innerWidth*dpr; c.height = innerHeight*dpr; ctx.scale(dpr,dpr);
  const cols = ['#FFC21A','#E3263C','#1574E0','#17A35A','#6B3FE0','#5BE8DC'];
  const parts = Array.from({length:140}, () => ({x:innerWidth/2, y:innerHeight/2.4, vx:(Math.random()-.5)*14, vy:-Math.random()*14-4, s:6+Math.random()*8, r:Math.random()*6, vr:(Math.random()-.5)*.3, c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0 = performance.now();
  (function frame(t){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    parts.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s/2,-p.s/3,p.s,p.s/1.6); ctx.restore(); });
    if (t - t0 < 2600) requestAnimationFrame(frame); else { ctx.clearRect(0,0,innerWidth,innerHeight); c.hidden = true; }
  })(t0);
}

/* ---------- render ---------- */
function defaultTab(){
  const d = new Date();

}
function render(){
  const tk = todayKey(); const t = today();
  if (!S.tab) S.tab = defaultTab();
  if (S.tab === 'bonus' && !isWeekend(t)) S.tab = defaultTab();
  const info = TAB_INFO[S.tab];

  $('playerName').textContent = S.cfg.name || 'Joueur';
  $('dayLbl').textContent = DAY_SHORT[t.getDay()] + ' · AUJOURD’HUI';
  $('todayStars').textContent = keyCount(tk) + ' / ' + KEY_IDS.length;
  $('scene').className = 'scene ' + info.scene;
  $('hillPath').setAttribute('fill', S.tab === 'soir' ? 'url(#hillN)' : 'url(#hillA)');
  $('badge').textContent = info.badge;
  $('badge').style.background = S.tab === 'soir' ? 'linear-gradient(180deg,#5CCBFF,#1574E0)' : S.tab === 'bonus' ? 'linear-gradient(180deg,#B49BFF,#6B3FE0)' : 'linear-gradient(180deg,#FF7A85,#E3263C)';
  $('titleText').textContent = info.title; $('titleShadow').textContent = info.title;
  $('soundWaves').style.display = S.sound ? '' : 'none';
  $('soundBtn').setAttribute('aria-label', S.sound ? 'Son activé' : 'Son coupé');

  // tabs
  const tabs = ['matin','soir'].concat(isWeekend(t) ? ['bonus'] : []);
  const done = doneOf(tk);
  $('tabs').innerHTML = tabs.map(k => {
    const list = MISSIONS[k]; const n = list.filter(m => done[m.id]).length;
    return '<button class="tab glossy" role="tab" data-tab="'+k+'" aria-selected="'+(k===S.tab)+'">'+TAB_ICON[k]+'<span>'+TAB_INFO[k].label+'</span><span class="count">'+n+'/'+list.length+'</span></button>';
  }).join('');

  // missions
  $('missions').innerHTML = MISSIONS[S.tab].map(m => {
    const on = !!done[m.id];
    const slot = m.key ? (on ? 'goldStar' : 'slotStar') : (on ? 'blueGem' : 'slotGem');
    return '<button class="mission '+(m.key?'key':'bonus')+(on?' done':'')+'" data-id="'+m.id+'" aria-pressed="'+on+'">'
      + '<span class="kind">'+(m.key?'MISSION CLÉ':'BONUS')+'</span>'
      + ICON[m.icon || m.id]
      + '<span class="txt"><span class="fr">'+m.fr+'</span>'+(m.sub?'<span class="sub">'+m.sub+'</span>':'')+'<span class="en">'+m.en+'</span></span>'
      + '<svg class="slot" viewBox="0 0 50 50" aria-hidden="true"><use href="#'+slot+'"/></svg></button>';
  }).join('');

  // power bar
  const m = monday(t); const won = weekWon(m);
  $('bar').innerHTML = [1,2,3,4,5].map(i => '<div class="blk'+(i<=won?' on':'')+'">'+i+'</div>').join('');
  $('medal').className = 'medal' + (won >= 5 ? ' on' : '');
  const wk = S.weeks[weekId(m)] || {};
  $('barStatus').innerHTML = won >= 5
    ? (wk.movieDone ? 'Soirée cinéma faite ! Bravo champion.<span class="en">Movie night done. Well played!</span>' : 'SOIRÉE CINÉMA DÉBLOQUÉE !<span class="en">Movie night unlocked! Ask a parent.</span>')
    : 'Encore ' + (5-won) + ' jour' + (5-won>1?'s':'') + ' gagné' + (5-won>1?'s':'') + ' pour le cinéma.<span class="en">' + (5-won) + ' more day' + (5-won>1?'s':'') + ' won to unlock movie night.</span>';

  // road
  const st = streakInfo(); const c = Math.min(st.count,3);
  let road = '';
  [1,2,3].forEach(i => { road += '<div class="node n'+i+(i<=c?' on':'')+'">'+i+'</div>'; road += '<div class="link'+(i<c||(i===3&&c===3)?' on':'')+'"></div>'; });
  road += '<div class="goal'+(c>=3?' on':'')+'"><svg width="52" height="26"><use href="#pad"/></svg>SWITCH</div>';
  $('road').innerHTML = road;
  $('roadStatus').innerHTML = c >= 3
    ? 'SÉANCE SWITCH GAGNÉE !<span class="en">Switch session won! Ask a parent.</span>'
    : 'Semaine ' + (c+1) + ' sur 3. Une semaine ratée, on repart à 1.<span class="en">Week ' + (c+1) + ' of 3. Miss a week and it restarts.</span>';
}

/* ---------- interactions ---------- */
let lastWonState = null;
$('tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (!b) return; S.tab = b.dataset.tab; SFX.tap(); render(); });
$('missions').addEventListener('click', e => {
  const b = e.target.closest('.mission'); if (!b) return;
  const tk = todayKey(); const id = b.dataset.id; const m = ALL.find(x => x.id === id);
  const wasWon = dayWon(tk); const wasWeek = weekWon(monday(today()));
  const d = Object.assign({}, doneOf(tk));
  if (d[id]) { delete d[id]; SFX.undo(); } else { d[id] = Date.now(); m.key ? SFX.coin() : SFX.gem(); }
  S.days[tk] = {date:tk, done:d};
  render(); saveDay(tk);
  if (!wasWon && dayWon(tk)) setTimeout(() => celebrate(wasWeek), 350);
});
function celebrate(prevWeek){
  SFX.win(); confetti();
  const nowWeek = weekWon(monday(today()));
  const movie = prevWeek < 5 && nowWeek >= 5;
  openOverlay('<div class="panel sheet celebrate" role="dialog" aria-label="Jour gagné">'
    + '<div class="burst">JOUR GAGNÉ !</div>'
    + '<p class="note" style="font-size:18px;margin:10px 0 0">+1 bloc dans ta barre de puissance · +1 power block</p>'
    + (movie ? '<div style="margin-top:14px"><svg width="64" height="76"><use href="#popcorn"/></svg></div><h3>SOIRÉE CINÉMA DÉBLOQUÉE !</h3><div class="en">Movie night unlocked!</div>' : '')
    + '<button class="cta" id="okBtn">SUPER !</button></div>');
  $('okBtn').addEventListener('click', closeOverlay);
}
$('soundBtn').addEventListener('click', () => { S.sound = !S.sound; try { localStorage.setItem('hmc-sound', S.sound ? 'on' : 'off'); } catch(e) {} render(); SFX.tap(); });
$('nameBtn').addEventListener('click', () => askName(false));

function askName(first){
  openOverlay('<form class="panel sheet" id="nameForm" data-modal="1"><h3>'+(first?'Salut héros !':'Ton nom de joueur')+'</h3><div class="en">'+(first?'What is your name?':'Player name')+'</div>'
    + '<div class="field"><input id="nameInput" maxlength="16" autocomplete="off" aria-label="Ton nom"></div>'
    + '<div class="row-btns"><button class="cta small" type="submit">OK</button>'+(first?'':'<button class="cta small ghost" type="button" id="cancelName">Annuler</button>')+'</div></form>');
  const inp = $('nameInput'); inp.value = S.cfg.name || ''; setTimeout(() => inp.focus(), 50);
  $('nameForm').addEventListener('submit', e => { e.preventDefault(); const v = inp.value.trim().slice(0,16); if (!v) return; S.cfg = Object.assign({}, S.cfg, {name:v}); write('config/main', S.cfg); closeOverlay(); render(); });
  const c = $('cancelName'); if (c) c.addEventListener('click', closeOverlay);
}
let askedName = false;
function maybeAskName(){ if (!askedName && !S.cfg.name) { askedName = true; askName(true); } }

/* ---------- parent area ---------- */
async function hashPin(p){
  try { const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('hmc:'+p)); return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join(''); }
  catch(e){ return 'plain:'+p; }
}
$('lockBtn').addEventListener('click', () => pinPad());
function pinPad(){
  let entry = '';
  const usingDefault = !S.cfg.pinHash;
  openOverlay('<div class="panel sheet" data-modal="1" role="dialog" aria-label="Code parents"><h3>Espace parents</h3><div class="en">Parents only · enter your 4-digit code'+(usingDefault?' (first time: 1234)':'')+'</div>'
    + '<div class="dots" id="dots"><i></i><i></i><i></i><i></i></div><div class="err" id="pinErr"></div>'
    + '<div class="pad" id="pinPad">'+[1,2,3,4,5,6,7,8,9].map(n=>'<button class="glossy" data-n="'+n+'">'+n+'</button>').join('')+'<button class="glossy" data-n="x" aria-label="Fermer">✕</button><button class="glossy" data-n="0">0</button><button class="glossy" data-n="b" aria-label="Effacer">⌫</button></div></div>');
  const dots = () => $('dots').querySelectorAll('i').forEach((el,i) => el.classList.toggle('on', i < entry.length));
  $('pinPad').addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b) return; const n = b.dataset.n; SFX.tap();
    if (n === 'x') return closeOverlay();
    if (n === 'b') { entry = entry.slice(0,-1); return dots(); }
    if (entry.length >= 4) return;
    entry += n; dots();
    if (entry.length === 4) {
      const ok = usingDefault ? entry === '1234' : (await hashPin(entry)) === S.cfg.pinHash;
      if (ok) { S.parentDay = todayKey(); parentPanel(usingDefault); }
      else { $('pinErr').textContent = 'Code incorrect · wrong code'; entry = ''; setTimeout(dots, 250); }
    }
  });
}
function parentPanel(needsPin){
  const m = monday(today()); const days = weekDates(m); const sel = S.parentDay || todayKey();
  const won = weekWon(m); const wk = S.weeks[weekId(m)] || {}; const st = streakInfo();
  const d = doneOf(sel); const selDate = new Date(sel+'T12:00:00');
  const groups = [['Matin', MISSIONS.matin], ['Soir', MISSIONS.soir]].concat(isWeekend(selDate) ? [['Week-end', MISSIONS.bonus]] : []);
  openOverlay('<div class="panel sheet" data-modal="1" role="dialog" aria-label="Espace parents" style="width:min(760px,100%)">'
    + '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><h3>Espace parents</h3><div class="en">Fix missions, validate rewards, settings</div></div><button class="cta small blue" id="closeParent">Fermer</button></div>'
    + (needsPin ? '<p class="note" style="color:#E3263C">Le code est encore 1234. Changez-le ci-dessous pour que votre enfant ne puisse pas entrer.</p>' : '')
    + '<div class="sec"><h4>Cette semaine · '+won+'/5 jours gagnés</h4><div class="days" id="pDays">'
    + days.map(k => { const dd = new Date(k+'T12:00:00'); return '<button class="day glossy'+(dayWon(k)?' won':'')+'" data-k="'+k+'" aria-pressed="'+(k===sel)+'">'+DAY_SHORT[dd.getDay()]+'<span class="n">'+keyCount(k)+'/'+KEY_IDS.length+'</span></button>'; }).join('')
    + '</div><p class="note">Touchez un jour pour corriger ses missions. Tap a day to fix it.</p>'
    + '<h4 style="margin-top:12px">'+DAY_LONG[selDate.getDay()]+' '+selDate.getDate()+'</h4>'
    + groups.map(([g,list]) => '<div class="note" style="margin-top:8px">'+g+'</div><div class="toggles">'+list.map(mm => '<button class="tg glossy'+(d[mm.id]?' on':'')+'" data-id="'+mm.id+'"><svg width="28" height="28" viewBox="0 0 50 50" aria-hidden="true"><use href="#'+(mm.key?(d[mm.id]?'goldStar':'slotStar'):(d[mm.id]?'blueGem':'slotGem'))+'"/></svg>'+mm.fr+'</button>').join('')+'</div>').join('')
    + '</div>'
    + '<div class="sec"><h4>Récompenses</h4>'
    + (won >= 5 ? (wk.movieDone ? '<p class="note">Soirée cinéma de cette semaine : faite.</p><button class="cta small ghost" id="movieUndo">Annuler « faite »</button>' : '<p class="note">Soirée cinéma débloquée cette semaine.</p><button class="cta small gold" id="movieDone">Soirée cinéma faite</button>') : '<p class="note">Soirée cinéma : '+won+'/5 jours gagnés cette semaine.</p>')
    + (st.count >= 3 ? '<div class="row-btns"><button class="cta small gold" id="switchDone">Séance Switch donnée · recommencer le défi</button></div>' : '<p class="note">Grand défi : '+Math.min(st.count,3)+'/3 semaines d’affilée.</p>')
    + '</div>'
    + '<div class="sec"><h4>Réglages</h4>'
    + '<form class="field" id="pinForm"><input id="newPin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="Nouveau code (4 chiffres)" aria-label="Nouveau code parents"><button class="cta small" type="submit">Changer le code</button></form>'
    + '<div class="row-btns"><button class="cta small ghost" id="renameBtn">Changer le nom du joueur</button></div>'
    + '<p class="note">'+(S.mode === 'db' ? 'Progrès enregistrés en ligne : identiques sur l’iPad et sur votre téléphone.' : 'Les progrès sont enregistrés sur cet iPad uniquement.')+'</p>'
    + '</div>'
    + (S.mode === 'local' ? '<div class="sec"><h4>Sauvegarde</h4><p class="note">De temps en temps, affichez le code, copiez-le dans Notes ou un e-mail. Pour restaurer : collez-le ici puis « Restaurer ».</p><textarea class="bk" id="bkText" aria-label="Code de sauvegarde"></textarea><div class="row-btns"><button class="cta small ghost" id="bkMake">Afficher le code</button><button class="cta small ghost" id="bkLoad">Restaurer ce code</button></div></div>' : '')
    + '</div>');
  const bkM = $('bkMake'); if (bkM) bkM.addEventListener('click', () => {
    const t = $('bkText');
    try { t.value = btoa(unescape(encodeURIComponent(JSON.stringify({cfg:S.cfg, days:S.days, weeks:S.weeks, sw:S.sw})))); t.focus(); t.select(); } catch(e) { toast('Impossible de créer le code.'); }
  });
  const bkL = $('bkLoad'); if (bkL) bkL.addEventListener('click', () => {
    try {
      const d = JSON.parse(decodeURIComponent(escape(atob($('bkText').value.trim()))));
      if (!d || typeof d !== 'object' || !d.days) throw new Error('bad');
      S.cfg = d.cfg || S.cfg; S.days = d.days || {}; S.weeks = d.weeks || {}; S.sw = d.sw || {claimedWeek:''};
      saveLocal(); render(); toast('Progrès restaurés.'); parentPanel(false);
    } catch(e) { toast('Code invalide : vérifiez qu’il est complet.'); }
  });
  $('closeParent').addEventListener('click', closeOverlay);
  $('pDays').addEventListener('click', e => { const b = e.target.closest('.day'); if (!b) return; S.parentDay = b.dataset.k; parentPanel(needsPin); });
  $('overlay').querySelectorAll('.tg').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.id; const dd = Object.assign({}, doneOf(sel));
    if (dd[id]) delete dd[id]; else dd[id] = Date.now();
    S.days[sel] = {date:sel, done:dd}; saveDay(sel); render(); parentPanel(needsPin);
  }));
  const md = $('movieDone'); if (md) md.addEventListener('click', () => { S.weeks[weekId(m)] = {movieDone:true, at:Date.now()}; write('weeks/'+weekId(m), S.weeks[weekId(m)]); render(); parentPanel(needsPin); toast('Bonne séance !'); });
  const mu = $('movieUndo'); if (mu) mu.addEventListener('click', () => { S.weeks[weekId(m)] = {movieDone:false}; write('weeks/'+weekId(m), S.weeks[weekId(m)]); render(); parentPanel(needsPin); });
  const sd = $('switchDone'); if (sd) sd.addEventListener('click', () => { S.sw = {claimedWeek: st.latest, at:Date.now()}; write('rewards/switch', S.sw); render(); parentPanel(needsPin); toast('Défi relancé : semaine 1.'); });
  $('pinForm').addEventListener('submit', async e => { e.preventDefault(); const v = $('newPin').value.trim(); if (!/^[0-9]{4}$/.test(v)) { toast('Le code doit avoir 4 chiffres.'); return; } S.cfg = Object.assign({}, S.cfg, {pinHash: await hashPin(v)}); write('config/main', S.cfg); toast('Code changé.'); parentPanel(false); });
  $('renameBtn').addEventListener('click', () => askName(false));
}

/* refresh at midnight / when the iPad wakes */
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
setInterval(render, 60000);

render();
initStore().then(() => { if (S.mode === 'local') maybeAskName(); });
})();
</script>
</body>
</html>
